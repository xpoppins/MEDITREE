<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B5A6"/>
      <stop offset="100%" stop-color="#0E8A7E"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12B5A6"/>
      <stop offset="100%" stop-color="#0E8A7E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0E1B2C"/>

  <!-- Tree canopy - leaves -->
  <g fill="url(#leafGrad)">
    <!-- Top leaves -->
    <ellipse cx="256" cy="105" rx="28" ry="38" transform="rotate(0 256 105)"/>
    <ellipse cx="200" cy="130" rx="24" ry="34" transform="rotate(-20 200 130)"/>
    <ellipse cx="312" cy="130" rx="24" ry="34" transform="rotate(20 312 130)"/>
    <ellipse cx="155" cy="175" rx="22" ry="30" transform="rotate(-35 155 175)"/>
    <ellipse cx="357" cy="175" rx="22" ry="30" transform="rotate(35 357 175)"/>
    <ellipse cx="120" cy="230" rx="20" ry="26" transform="rotate(-50 120 230)"/>
    <ellipse cx="392" cy="230" rx="20" ry="26" transform="rotate(50 392 230)"/>
    <ellipse cx="105" cy="290" rx="18" ry="22" transform="rotate(-60 105 290)"/>
    <ellipse cx="407" cy="290" rx="18" ry="22" transform="rotate(60 407 290)"/>
    <!-- Center leaves -->
    <ellipse cx="256" cy="155" rx="30" ry="40"/>
    <ellipse cx="220" cy="185" rx="26" ry="36"/>
    <ellipse cx="292" cy="185" rx="26" ry="36"/>
    <ellipse cx="185" cy="225" rx="24" ry="32"/>
    <ellipse cx="327" cy="225" rx="24" ry="32"/>
    <ellipse cx="160" cy="270" rx="22" ry="28"/>
    <ellipse cx="352" cy="270" rx="22" ry="28"/>
    <ellipse cx="256" cy="200" rx="32" ry="42"/>
    <ellipse cx="200" cy="240" rx="28" ry="38"/>
    <ellipse cx="312" cy="240" rx="28" ry="38"/>
  </g>

  <!-- Tree trunk - Medical Cross -->
  <g fill="url(#crossGrad)">
    <!-- Vertical bar of cross -->
    <rect x="236" y="280" width="40" height="120" rx="8"/>
    <!-- Horizontal bar of cross -->
    <rect x="196" y="310" width="120" height="40" rx="8"/>
  </g>

  <!-- Cross center highlight -->
  <rect x="246" y="320" width="20" height="60" rx="4" fill="#0E8A7E" opacity="0.5"/>
  <rect x="206" y="330" width="100" height="20" rx="4" fill="#0E8A7E" opacity="0.5"/>

  <!-- Ground/base -->
  <ellipse cx="256" cy="420" rx="80" ry="16" fill="#12B5A6" opacity="0.3"/>
</svg>